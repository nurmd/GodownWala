name: Build & Release CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Determine Version Name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.5" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Run Lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p release-apks
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" release-apks/GodownWala.apk
          echo "Prepared release APK at release-apks/GodownWala.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodownWala-apk
          path: release-apks/GodownWala.apk
          retention-days: 14

      - name: Publish GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/GodownWala.apk
          generate_release_notes: true
          draft: false
          prerelease: false